name: .NET

on:
  push:
    branches: [ "master", "staging", "dev" ]
  pull_request:
    branches: [ "master", "staging", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CONFIG: ${{ (github.ref_name == 'dev' || github.base_ref == 'dev') && 'Debug' || 'Release' }}

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore project dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration ${{ env.CONFIG }} --no-restore

    - name: Run Tests
      run: dotnet test --configuration ${{ env.CONFIG }} --no-build --verbosity normal